# Ambiente de desenvolvimento local. NÃO usar em produção (senhas fixas,
# Keycloak em modo dev). Uso: veja o README da raiz.
name: itree

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: itree
      POSTGRES_PASSWORD: itree
      POSTGRES_DB: itree
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itree"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  keycloak:
    image: keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - ./keycloak/realm-itree.json:/opt/keycloak/data/import/realm-itree.json:ro

  api:
    profiles: ["api"]
    build: { context: ../../backend }
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: dev-somente-local
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgis://itree:itree@db:5432/itree
      REDIS_URL: redis://redis:6379/0
      OIDC_ISSUER: http://localhost:8080/realms/itree
      OIDC_JWKS_URL: http://keycloak:8080/realms/itree/protocol/openid-connect/certs
      OIDC_AUDIENCE: itree-api
    ports: ["8000:8000"]
    volumes: ["../../backend/itree:/app/itree", "../../backend/config:/app/config"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  db:
