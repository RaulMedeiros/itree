[project]
name = "itree-backend"
version = "0.1.0"
description = "Backend da Engine de Inteligência Arbórea"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-pghistory>=3.9.2",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "fpdf2>=2.9.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "BLE", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501", "E731"]
# SQL dos vector tiles é montado só com constantes do módulo; valores vão como parâmetros.
"itree/mapa/views.py" = ["S608"]
# Catálogos de textos (definições de análises e critérios de qualidade).
"itree/relatorios/views.py" = ["E501"]
"itree/qualidade/views.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
