openapi: 3.0.3
info:
  title: Engine de Inteligência Arbórea — API
  version: 0.1.0
  description: API do painel web e do aplicativo de campo.
paths:
  /api/v1/admin/auditoria:
    get:
      operationId: auditoria_listar
      description: |-
        Trilha de auditoria (RF-ADM-003). Somente leitura: eventos não podem ser
        alterados nem removidos pela aplicação (RNF-SEG-004).
      parameters:
      - in: query
        name: ate
        schema:
          type: string
        description: ISO 8601
      - in: query
        name: desde
        schema:
          type: string
        description: ISO 8601
      - in: query
        name: entidade
        schema:
          type: string
        description: 'Um de: contas.UsuarioEvent, contas.EscopoUsuarioEvent, contas.EquipeEvent,
          contas.MembroEquipeEvent, contas.TerritorioEquipeEvent, territorio.TerritorioEvent,
          inventario.EspecieEvent, inventario.ArvoreEvent, inventario.IdentificadorExternoEvent,
          inventario.MedidaEvent, inventario.LoteImportacaoEvent, inventario.ParNaoDuplicadoEvent,
          ocorrencias.TipoOcorrenciaEvent, ocorrencias.OcorrenciaEvent, evidencias.EvidenciaEvent'
      - in: query
        name: objeto
        schema:
          type: string
        description: ID do objeto auditado.
      - in: query
        name: origem
        schema:
          type: string
        description: web | app | api
      - name: pagina
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: tamanho
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: usuario
        schema:
          type: string
        description: ID do usuário autor.
      tags:
      - auditoria
      security:
      - oidc: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventoAuditoriaList'
          description: ''
  /api/v1/admin/usuarios:
    get:
      operationId: usuarios_listar
      description: |-
        Administração de usuários (W-10). Usuários não são excluídos; são
        desativados, preservando autoria dos registros (RF-ADM-001).
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
      - in: query
        name: busca
        schema:
          type: string
        description: Nome ou e-mail.
      - name: pagina
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: papel
        schema:
          type: string
      - name: tamanho
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - usuarios
      security:
      - oidc: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioAdminList'
          description: ''
    post:
      operationId: usuarios_criar
      description: |-
        Administração de usuários (W-10). Usuários não são excluídos; são
        desativados, preservando autoria dos registros (RF-ADM-001).
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsuarioAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsuarioAdminRequest'
        required: true
      security:
      - oidc: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
          description: ''
  /api/v1/admin/usuarios/{id}:
    get:
      operationId: usuarios_obter
      description: |-
        Administração de usuários (W-10). Usuários não são excluídos; são
        desativados, preservando autoria dos registros (RF-ADM-001).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este usuario.
        required: true
      tags:
      - usuarios
      security:
      - oidc: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
          description: ''
    patch:
      operationId: usuarios_atualizar
      description: |-
        Administração de usuários (W-10). Usuários não são excluídos; são
        desativados, preservando autoria dos registros (RF-ADM-001).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
