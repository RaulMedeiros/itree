        schema:
          type: string
        description: Código (ARV-000123), identificador externo ou endereço.
      - in: query
        name: especie
        schema:
          type: string
      - in: query
        name: especie_estado
        schema:
          type: string
      - in: query
        name: localizacao_origem
        schema:
          type: string
      - in: query
        name: lote
        schema:
          type: string
      - in: query
        name: ordenar
        schema:
          type: string
        description: numero, -numero, atualizado_em, -atualizado_em
      - name: pagina
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: situacao
        schema:
          type: string
        description: 'Padrão: ativa. Use ''todas'' para incluir as demais.'
      - name: tamanho
        required: false
