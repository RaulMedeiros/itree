components:
  schemas:
    AcaoComMotivoRequest:
      type: object
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - motivo
    Arvore:
      type: object
      description: Detalhe e edição. Campos validados exigem justificativa (RF-INV-009).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        codigo:
          type: string
          readOnly: true
        especie:
          allOf:
          - $ref: '#/components/schemas/EspecieResumo'
          readOnly: true
        especie_estado:
          $ref: '#/components/schemas/EstadoEspecieEnum'
        especie_texto_original:
          type: string
          description: Nome como veio da fonte, quando não casou com o catálogo.
          maxLength: 200
        localizacao:
          allOf:
          - $ref: '#/components/schemas/Localizacao'
          nullable: true
        localizacao_origem:
          oneOf:
          - $ref: '#/components/schemas/OrigemLocalizacaoEnum'
          - $ref: '#/components/schemas/BlankEnum'
        precisao_m:
          type: number
          format: double
          nullable: true
          description: Precisão horizontal informada, em metros.
        endereco:
          type: string
          maxLength: 300
        bairro:
          allOf:
          - $ref: '#/components/schemas/TerritorioResumo'
          readOnly: true
        situacao:
          allOf:
          - $ref: '#/components/schemas/SituacaoArvoreEnum'
          readOnly: true
        valida:
          type: boolean
          readOnly: true
        origem_registro:
          allOf:
          - $ref: '#/components/schemas/OrigemRegistroEnum'
          readOnly: true
        ocorrencias_abertas:
          type: integer
          readOnly: true
          default: 0
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
        identificadores:
          type: array
          items:
            $ref: '#/components/schemas/IdentificadorExterno'
          readOnly: true
        medidas_atuais:
          type: array
          items:
            $ref: '#/components/schemas/Medida'
          readOnly: true
        fundida_em:
          type: string
          nullable: true
          readOnly: true
        motivo_situacao:
          type: string
          readOnly: true
        lote:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        criado_por_nome:
          type: string
          readOnly: true
        observacoes:
          type: string
      required:
      - atualizado_em
      - bairro
      - codigo
      - criado_em
      - criado_por_nome
      - especie
      - fundida_em
      - id
      - identificadores
      - lote
      - medidas_atuais
      - motivo_situacao
      - ocorrencias_abertas
      - origem_registro
      - situacao
      - valida
    ArvoreRequest:
      type: object
      description: Detalhe e edição. Campos validados exigem justificativa (RF-INV-009).
      properties:
        especie_estado:
          $ref: '#/components/schemas/EstadoEspecieEnum'
        especie_texto_original:
          type: string
          description: Nome como veio da fonte, quando não casou com o catálogo.
          maxLength: 200
        localizacao:
          allOf:
          - $ref: '#/components/schemas/LocalizacaoRequest'
          nullable: true
        localizacao_origem:
          oneOf:
          - $ref: '#/components/schemas/OrigemLocalizacaoEnum'
          - $ref: '#/components/schemas/BlankEnum'
        precisao_m:
          type: number
          format: double
          nullable: true
          description: Precisão horizontal informada, em metros.
        endereco:
          type: string
          maxLength: 300
        especie_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        observacoes:
          type: string
