        required: true
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUsuarioAdminRequest'
      security:
      - oidc: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
          description: ''
  /api/v1/arvores:
