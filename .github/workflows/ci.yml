name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: itree
          POSTGRES_PASSWORD: itree
          POSTGRES_DB: itree
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itree" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci
      DATABASE_URL: postgis://itree:itree@localhost:5432/itree
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas geoespaciais
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: Contrato OpenAPI atualizado
        run: |
          uv run python manage.py spectacular --file ../packages/api-client/openapi.yaml --validate --fail-on-warn
          git diff --exit-code -- ../packages/api-client/openapi.yaml || {
            echo "::error::openapi.yaml desatualizado. Rode 'manage.py spectacular' e 'pnpm gerar:api'."; exit 1; }

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cliente da API gerado a partir do contrato
        run: |
          pnpm gerar:api
          git diff --exit-code -- packages/api-client/src/gerado || {
            echo "::error::Cliente gerado desatualizado. Rode 'pnpm gerar:api'."; exit 1; }
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
