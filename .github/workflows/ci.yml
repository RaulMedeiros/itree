name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nenhum job escreve no repositório; o cache do GHA usa o token do runtime.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: itree
          POSTGRES_PASSWORD: itree
          POSTGRES_DB: itree
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itree" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci
      DATABASE_URL: postgis://itree:itree@localhost:5432/itree
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bibliotecas geoespaciais
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: Vulnerabilidades conhecidas (dependências de produção)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requisitos.txt
          uvx pip-audit==2.10.1 --strict --no-deps --disable-pip -r /tmp/requisitos.txt
      - name: Contrato OpenAPI atualizado
        run: |
          if ! uv run python manage.py spectacular --file ../packages/api-client/openapi.yaml \
               --validate --fail-on-warn 2> /tmp/spectacular.log; then
            echo "::error title=Geração do contrato::$(tr '\n' ' ' < /tmp/spectacular.log | cut -c1-1500)"
            exit 1
          fi
          if ! git diff --exit-code -- ../packages/api-client/openapi.yaml > /tmp/contrato.diff; then
            echo "::error title=openapi.yaml desatualizado::$(head -c 1500 /tmp/contrato.diff | tr '\n' ' ')"
            exit 1
          fi

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilidades conhecidas (dependências de produção)
        run: pnpm audit --prod --audit-level high
      - name: Cliente da API gerado a partir do contrato
        run: |
          pnpm gerar:api
          git diff --exit-code -- packages/api-client/src/gerado || {
            echo "::error::Cliente gerado desatualizado. Rode 'pnpm gerar:api'."; exit 1; }
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  imagens:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Imagem da API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: itree/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Imagem do painel web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: itree/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Verificações de implantação do Django na imagem
        run: |
          docker run --rm -e DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
            -e DJANGO_ALLOWED_HOSTS=itree.exemplo.gov.br itree/api:ci manage check --deploy --fail-level ERROR
      - name: Pilha completa sobe e responde
        working-directory: infra/docker
        run: |
          docker tag itree/api:ci itree/api:dev
          docker tag itree/web:ci itree/web:dev
          docker compose --profile completo up -d --no-build
          for i in $(seq 1 60); do curl -sf http://localhost:8088/api/v1/saude && break; sleep 5; done
          curl -sf http://localhost:8088/api/v1/saude
          curl -sf http://localhost:8088/ | grep -q "Engine de Inteligência Arbórea"
          curl -sf http://localhost:8088/config.js | grep -q oidcAuthority
          # Cabeçalhos de segurança chegam ao documento do SPA e aos assets.
          for caminho in / /mapa /config.js; do
            curl -sfI "http://localhost:8088$caminho" | tee /tmp/cabecalhos.txt
            grep -qi '^x-frame-options: DENY' /tmp/cabecalhos.txt
            grep -qi '^content-security-policy:' /tmp/cabecalhos.txt
            grep -qi '^x-content-type-options: nosniff' /tmp/cabecalhos.txt
          done
      - name: Logs em caso de falha
        if: failure()
        working-directory: infra/docker
        run: docker compose --profile completo logs --tail 100
